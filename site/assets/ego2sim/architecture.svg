<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#668784" stroke-width="1.8"/></marker></defs><style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1800" height="1040" rx="0" fill="#f1f4ef" stroke="none"/><text x="60" y="64" font-size="42" fill="#263e46" font-weight="700">EGO2SIM</text><text x="285" y="64" font-size="31" fill="#263e46" font-weight="400">从第一视角示范，到可编辑的机器人场景</text><text x="60" y="105" font-size="20" fill="#647d80" font-weight="400">滴管任务 · 两组资产 · 来源与不确定性贯穿每个阶段</text><rect x="60" y="144" width="1680" height="126" rx="20" fill="#213f47" stroke="none"/><text x="90" y="183" font-size="29" fill="#f4f8f4" font-weight="700">Coding Agent</text><text x="90" y="224" font-size="25" fill="#e0ece6" font-weight="400">读视频与配置 → 调用模型 → 编写导入与重定向代码 → 检查证据 → 修改候选</text><text x="1240" y="183" font-size="21" fill="#b9d8cc" font-weight="400">工具与中间结果可追溯</text><text x="1240" y="222" font-size="20" fill="#b9d8cc" font-weight="400">分开观测与执行时钟 / 来源可追溯</text><rect x="60" y="312" width="390" height="368" rx="20" fill="#ffffff" stroke="#d3dfd9"/><text x="84" y="352" font-size="22" fill="#438b78" font-weight="700">01</text><text x="84" y="393" font-size="28" fill="#263e46" font-weight="700">任务理解与分解</text><text x="84" y="424" font-size="13" fill="#6f8788" font-weight="400">OBSERVATION → TASK GRAPH</text><text x="84" y="479" font-size="18" fill="#36535a" font-weight="400">视频动作阶段与字幕</text><text x="84" y="524" font-size="18" fill="#36535a" font-weight="400">操作对象 / 手部角色 / 目标</text><text x="84" y="569" font-size="18" fill="#36535a" font-weight="400">捏取 → 转移 → 滴加 → 放回</text><text x="84" y="614" font-size="18" fill="#36535a" font-weight="600">输出：带时间戳的任务图</text><path d="M458 494H482" stroke="#668784" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="312" width="390" height="368" rx="20" fill="#ffffff" stroke="#d3dfd9"/><text x="514" y="352" font-size="22" fill="#438b78" font-weight="700">02</text><text x="514" y="393" font-size="28" fill="#263e46" font-weight="700">场景与资产重建</text><text x="514" y="424" font-size="13" fill="#6f8788" font-weight="400">PIXELS → EDITABLE SCENE</text><text x="514" y="479" font-size="18" fill="#36535a" font-weight="400">SAM3 → DA3 → 反投影 RGB 点云</text><text x="514" y="524" font-size="18" fill="#36535a" font-weight="400">RANSAC 桌面 → 统一观测坐标</text><text x="514" y="569" font-size="18" fill="#36535a" font-weight="400">固定 CAD → 动态滴管与容器位姿</text><text x="514" y="614" font-size="18" fill="#36535a" font-weight="600">输出：点云 / 动态位姿 / Blender</text><path d="M888 494H912" stroke="#668784" stroke-width="2" marker-end="url(#arrow)"/><rect x="920" y="312" width="390" height="368" rx="20" fill="#ffffff" stroke="#d3dfd9"/><text x="944" y="352" font-size="22" fill="#438b78" font-weight="700">03</text><text x="944" y="393" font-size="28" fill="#263e46" font-weight="700">人类动作与接触</text><text x="944" y="424" font-size="13" fill="#6f8788" font-weight="400">HUMAN → CONTACT CANDIDATES</text><text x="944" y="479" font-size="18" fill="#36535a" font-weight="400">MediaPipe → 保骨长关节优化</text><text x="944" y="524" font-size="18" fill="#36535a" font-weight="400">保留缺失 / 几何失败候选拒绝</text><text x="944" y="569" font-size="18" fill="#36535a" font-weight="400">Mesh 三角面锚点＋三维距离</text><text x="944" y="614" font-size="18" fill="#36535a" font-weight="600">输出：观测与候选（非测量力）</text><path d="M1318 494H1342" stroke="#668784" stroke-width="2" marker-end="url(#arrow)"/><rect x="1350" y="312" width="390" height="368" rx="20" fill="#ffffff" stroke="#d3dfd9"/><text x="1374" y="352" font-size="22" fill="#438b78" font-weight="700">04</text><text x="1374" y="393" font-size="28" fill="#263e46" font-weight="700">机器人动作重定向</text><text x="1374" y="424" font-size="13" fill="#6f8788" font-weight="400">TASK TARGETS → ROBOT</text><text x="1374" y="479" font-size="18" fill="#36535a" font-weight="400">RealMan RM65-B＋Xense</text><text x="1374" y="524" font-size="18" fill="#36535a" font-weight="400">刚体注册＋显式布局适配</text><text x="1374" y="569" font-size="18" fill="#36535a" font-weight="400">接触中心 → 连续关节轨迹＋释放</text><text x="1374" y="614" font-size="18" fill="#36535a" font-weight="600">输出：30 Hz 实际求解回放</text><rect x="60" y="720" width="1110" height="150" rx="20" fill="#dfece5" stroke="none"/><text x="88" y="758" font-size="25" fill="#263e46" font-weight="700">本轮已经执行的检查与修正</text><text x="88" y="804" font-size="22" fill="#263e46" font-weight="400">动态位姿 · 坐标回算 · 三角面接触点 · 手部重投影 · 原装配与 IK 核验</text><text x="88" y="842" font-size="20" fill="#526f72" font-weight="400">检查结果返回 Agent，修改提示、资产映射、坐标与动作候选后重新生成。</text><rect x="1200" y="720" width="540" height="150" rx="20" fill="#f1e8d5" stroke="none"/><text x="1226" y="758" font-size="25" fill="#263e46" font-weight="700">基础接触试跑与反馈</text><text x="1226" y="801" font-size="21" fill="#263e46" font-weight="400">重力 / 有限驱动 / 自由物体 / 碰撞</text><text x="1226" y="840" font-size="21" fill="#8b7147" font-weight="400">滴管抓取与放回通过；液体未求解。</text><path d="M630 718V699H30V205H52" fill="none" stroke="#668784" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="927" font-size="25" fill="#263e46" font-weight="700">交付</text><text x="150" y="927" font-size="24" fill="#263e46" font-weight="400">处理阶段视频 · 两组资产场景 · 机器人求解轨迹 · 网站 Part 2 · 生成与验证报告</text><text x="60" y="982" font-size="21" fill="#6a7d80" font-weight="400">边界：单目估计与物理初态适配分别保留；名义接触验证不等于液体求解或真机成功。</text></svg>